plugins { id 'com.android.application' }
android {
    namespace 'com.limbusarchive.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.limbusarchive.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
    signingConfigs {
        release {
            storeFile file('../limbusarchive.keystore')
            storePassword 'limbusarchive'
            keyAlias 'limbusarchive'
            keyPassword 'limbusarchive'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
